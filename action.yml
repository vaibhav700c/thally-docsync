name: "Docsync verify examples"
description: "Run a Thally docs site's embedded code samples against an already-running product server and fail the job if any regress."
inputs:
  config:
    description: "Path to docsync.config.json"
    required: false
    default: "docsync.config.json"
  label:
    description: "Report label (used in the output filename)"
    required: false
    default: "ci"
  env-file:
    description: "Optional path to a shell-format env file to source before running (e.g. GITLITE_TOKEN=...). Never echoed."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run example verification
      shell: bash
      env:
        # Inputs pass through env, never expanded into the script, to avoid shell injection.
        DOCSYNC_CONFIG: ${{ inputs.config }}
        DOCSYNC_LABEL: ${{ inputs.label }}
        DOCSYNC_ENV_FILE: ${{ inputs.env-file }}
        DOCSYNC_BIN: ${{ github.action_path }}/bin/verify-examples.mjs
      run: |
        set -euo pipefail
        if [ -n "$DOCSYNC_ENV_FILE" ]; then
          if [ ! -f "$DOCSYNC_ENV_FILE" ]; then
            echo "env-file not found: $DOCSYNC_ENV_FILE" >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source "$DOCSYNC_ENV_FILE"
          set +a
        fi
        node "$DOCSYNC_BIN" "$DOCSYNC_LABEL" --config "$DOCSYNC_CONFIG"
